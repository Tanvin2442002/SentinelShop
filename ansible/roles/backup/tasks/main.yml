- name: Backup and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ backup_dir }}", mode: "0700" }
    - { path: /etc/shop, mode: "0750" }

- name: Database settings for the backup job
  ansible.builtin.copy:
    dest: /etc/shop/backup.env
    owner: root
    group: root
    mode: "0600"
    content: |
      PGHOST={{ backup_db_host }}
      PGPORT={{ backup_db_port }}
      PGUSER={{ backup_db_user }}
      PGDATABASE={{ backup_db_name }}
      PGPASSWORD={{ lookup('env', 'SHOP_DB_PASSWORD') }}
      BACKUP_DIR={{ backup_dir }}
  no_log: true

- name: Backup script
  ansible.builtin.copy:
    src: shop-backup.sh
    dest: /usr/local/bin/shop-backup.sh
    mode: "0755"

- name: Backup service and timer units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - shop-backup.service
    - shop-backup.timer

- name: Enable and start the timer
  ansible.builtin.systemd:
    name: shop-backup.timer
    enabled: true
    state: started
    daemon_reload: true
