apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  labels:
    {{- include "shop.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DB: {{ .Values.config.db.name | quote }}
  POSTGRES_USER: {{ .Values.config.db.user | quote }}
  CHAOS_LATENCY_MS: {{ .Values.config.chaos.latencyMs | quote }}
  CHAOS_ERROR_RATE: {{ .Values.config.chaos.errorRate | quote }}
  CHAOS_SLOW_DB: {{ .Values.config.chaos.slowDb | quote }}
  CHAOS_MEMORY_LEAK: {{ .Values.config.chaos.memoryLeak | quote }}
