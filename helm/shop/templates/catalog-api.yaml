apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  labels:
    app: catalog-api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  selector:
    app: catalog-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.catalogApi.replicas }}
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog-api
      containers:
        - name: catalog-api
          image: {{ .Values.registry }}/catalog-api:{{ .Values.tag }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: DATABASE_URL}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: SECRET_KEY}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.catalogApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  labels:
    app: catalog-api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog-api
