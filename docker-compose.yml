name: sentinelshop

services:
  log-init:
    image: python:3.12-alpine
    command:
      - sh
      - -c
      - >-
        chmod 1777 /var/log/shop;
        [ -e /etc/nginx/blocklist/blocklist.conf ] || touch /etc/nginx/blocklist/blocklist.conf;
        chown 10001:10001 /etc/nginx/blocklist /etc/nginx/blocklist/blocklist.conf
    volumes:
      - shoplogs:/var/log/shop
      - blocklist:/etc/nginx/blocklist
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
    mem_limit: 16m

  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/catalog-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - shop-net

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - shop-net

  catalog-api:
    image: ${REGISTRY:-localhost:5000}/catalog-api:${TAG:-dev}
    build:
      context: ./services/catalog-api
    restart: unless-stopped
    env_file:
      - chaos/active.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    networks:
      - shop-net

  order-worker:
    image: ${REGISTRY:-localhost:5000}/order-worker:${TAG:-dev}
    build:
      context: ./services/order-worker
    restart: unless-stopped
    env_file:
      - chaos/active.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/shop/worker.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/shop:uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    networks:
      - shop-net
  
  web:
    image: ${REGISTRY:-localhost:5000}/web:${TAG:-dev}
    build:
      context: ./services/web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    networks:
      - shop-net
  
  edge:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    volumes:
      - ./services/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/edge/blocklist-watch.sh:/docker-entrypoint.d/40-blocklist-watch.sh:ro
      - blocklist:/etc/nginx/blocklist:ro
      - shoplogs:/var/log/shop
    depends_on:
      log-init:
        condition: service_completed_successfully
      catalog-api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    networks:
      shop-net:
        ipv4_address: 172.30.0.10

networks:
  shop-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  shoplogs:
  blocklist:
  pgdata:
  redisdata:
