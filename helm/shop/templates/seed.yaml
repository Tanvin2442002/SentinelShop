apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-initdb
  labels:
    {{- include "shop.labels" . | nindent 4 }}
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-{{ .Files.Get "files/init.sql" | sha256sum | trunc 8 }}
  labels:
    app: seed
    {{- include "shop.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: {{ .Values.registry }}/{{ .Values.postgres.image }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /seed/init.sql
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: shop-config, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: shop-config, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: seed, mountPath: /seed}
      volumes:
        - name: seed
          configMap:
            name: shop-initdb
