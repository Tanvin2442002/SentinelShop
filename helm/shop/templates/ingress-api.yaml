apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-api@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 8000
