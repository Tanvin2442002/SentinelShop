apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-web
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          - path: /api/metrics
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
