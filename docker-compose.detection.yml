services:
  attacker:
    build: ./detection/attacker
    image: ${REGISTRY:-localhost:5000}/attacker:${TAG:-dev}
    restart: unless-stopped
    environment:
      EDGE_URL: http://edge:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    networks:
      shop-net:
        ipv4_address: 172.30.0.50

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh-manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    volumes:
      - ./detection/wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./detection/wazuh/filebeat-run:/etc/services.d/filebeat/run:ro
      - ./detection/wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - shoplogs:/var/log/shop:ro
    mem_limit: 1g
    cpus: 1.5
    networks:
      - shop-net

  responder:
    build: ./detection/responder
    image: ${REGISTRY:-localhost:5000}/responder:${TAG:-dev}
    restart: unless-stopped
    environment:
      BLOCK_TTL_SECONDS: ${BLOCK_TTL_SECONDS:-600}
    volumes:
      - ./detection/responder/allowlist.txt:/config/allowlist.txt:ro
      - ./detection/responder/reputation.json:/config/reputation.json:ro
      - blocklist:/etc/nginx/blocklist
    tmpfs:
      - /data:uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    networks:
      shop-net:
        ipv4_address: 172.30.0.30
