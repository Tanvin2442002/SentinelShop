worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 16k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format json escape=json
    '{"timestamp":"$time_iso8601","service":"edge","remote_addr":"$remote_addr",'
    '"trace_id":"$request_id","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;
  access_log /var/log/shop/edge.json json;

  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /edge-healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/metrics {
      return 404;
    }

    location /api/ {
      set $api_upstream http://catalog-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
       # nosemgrep: generic.nginx.security.missing-internal.missing-internal
      proxy_pass $api_upstream;
      proxy_set_header Host catalog-api;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Trace-Id $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }

    location / {
      set $web_upstream http://web:8080;
       # nosemgrep: generic.nginx.security.missing-internal.missing-internal
      proxy_pass $web_upstream;
      proxy_set_header Host web;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }
  }
}